name: youcommuter

x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 20s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
    environment:
      POSTGRES_USER: youcommuter
      POSTGRES_DB: youcommuter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-youcommuter_dev_only}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U youcommuter -d youcommuter"]
      interval: 3s
      timeout: 3s
      retries: 20

  initdb:
    image: youcommuter-backend:local
    build:
      context: .
      dockerfile: deploy/Dockerfile
    entrypoint: ["/initdb"]
    environment:
      DATABASE_URL: postgres://youcommuter:${POSTGRES_PASSWORD:-youcommuter_dev_only}@postgres:5432/youcommuter?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *runtime
    image: youcommuter-backend:local
    environment:
      HTTP_ADDRESS: ":8080"
      PREDICTION_API_KEY: ${PREDICTION_API_KEY:-}
      DATABASE_URL: postgres://youcommuter:${POSTGRES_PASSWORD:-youcommuter_dev_only}@postgres:5432/youcommuter?sslmode=disable
    ports:
      - "127.0.0.1:${YOUCOMMUTER_HTTP_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "/healthcheck", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      initdb:
        condition: service_completed_successfully

  collector:
    <<: *runtime
    image: youcommuter-backend:local
    entrypoint: ["/collect"]
    environment:
      DATABASE_URL: postgres://youcommuter:${POSTGRES_PASSWORD:-youcommuter_dev_only}@postgres:5432/youcommuter?sslmode=disable
      YOUBIKE_BASE_URL: ${YOUBIKE_BASE_URL:-https://apis.youbike.com.tw/}
      FEED_POLL_INTERVAL: ${FEED_POLL_INTERVAL:-1m}
      FEED_STALE_AFTER: ${FEED_STALE_AFTER:-5m}
      SNAPSHOT_RETENTION_DAYS: ${SNAPSHOT_RETENTION_DAYS:-90}
    healthcheck:
      test: ["CMD", "/healthcheck", "http://127.0.0.1:8081/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m
    depends_on:
      initdb:
        condition: service_completed_successfully

volumes:
  postgres-data:
